services:
  - type: web
    name: soprano-registry-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soprano-registry-db
          property: connectionString

databases:
  - name: soprano-registry-db
